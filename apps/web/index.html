<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Demo: is the software a medical device in the EU, which MDR class, and what follows — every answer with a verbatim quote."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 .8l6.3 3.6v7.2L8 15.2l-6.3-3.6V4.4z' fill='%230c433c'/%3E%3Crect x='3.6' y='7' width='8.8' height='3.2' rx='.8' fill='%23e8b467'/%3E%3C/svg%3E"
    />
    <title>Навігатор регуляторики медвиробів</title>
    <script>
      // The reader's light or dark and plain look (lib/theme.ts), before the first paint: the app's bundle comes later.
      try {
        const theme = localStorage.getItem("mrn.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        if (localStorage.getItem("mrn.waves") === "off") document.documentElement.dataset.waves = "off";
      } catch {
        // no storage: the system's scheme
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
